name: kvitlach

services:
  db:
    container_name: kvitlach-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=kvitlach
      - POSTGRES_PASSWORD=kvitlach
      - POSTGRES_DB=kvitlach
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvitlach"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:25432:5432"
    mem_limit: 512m

  backend:
    container_name: kvitlach-backend
    build: ../backend
    environment:
      - PORT=25000
      - WS_PORT=25001
      - DATABASE_URL=postgres://kvitlach:kvitlach@db:5432/kvitlach
      # Boot DEFAULTS only. Whatever was last set from /admin is stored in
      # Postgres and wins over these on startup -- deliberately, so a lockdown
      # flipped because the box was struggling is not undone by the restart
      # that usually follows. MAINTENANCE_MODE is still honoured (it maps to
      # ACCESS_MODE=closed) so an existing deploy that has it set does not
      # quietly reopen. See backend/src/access.ts.
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-}
      - ACCESS_MODE=${ACCESS_MODE:-}
      - ACCESS_CODES=${ACCESS_CODES:-}
      # Capacity caps -- boot defaults only, same as above. Unset means the
      # built-in 150 / 25 / 100 (backend/src/limits.ts).
      - MAX_ROOMS=${MAX_ROOMS:-}
      - MAX_PRACTICE_ROOMS=${MAX_PRACTICE_ROOMS:-}
      - MAX_PLAYERS_PER_ROOM=${MAX_PLAYERS_PER_ROOM:-}
      # Admin panel. With none of these set the panel 404s entirely, which is
      # the default. ADMIN_PASSWORD_HASH comes from `npm run hash-password`;
      # ADMIN_PASSWORD (plaintext) works but warns on every boot. Set
      # ADMIN_SESSION_SECRET to keep logins alive across restarts -- unset
      # means a fresh random secret per boot, i.e. a restart signs you out.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
    restart: unless-stopped
    ports:
      # 25000 carries the admin panel AND /health, /health/detail, /metrics --
      # anything that can reach one can read the others. ADMIN_BIND controls
      # who that is; it defaults to 127.0.0.1, so an operator who does nothing
      # keeps the old server-browser-or-SSH-tunnel-only behaviour.
      #
      #   100.x.y.z (the box's Tailscale IP) -- tailnet only, encrypted end to
      #     end by WireGuard. The safest option that still works off-site.
      #   192.168.50.23 -- LAN only. Works from any machine in the house, but
      #     the login crosses the wire as cleartext HTTP.
      #   0.0.0.0 -- both at once, which is the only way to get both from a
      #     single mapping. No public exposure follows from this on its own
      #     (nothing forwards 25000 from the router, and the tunnel only
      #     carries the frontend), but it does mean every present and FUTURE
      #     interface, so re-check it if this box ever gets another network.
      - "${ADMIN_BIND:-127.0.0.1}:25000:25000"
      - "127.0.0.1:25001:25001"
    mem_limit: 1g
    cpus: "3.0"
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:25000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    container_name: kvitlach-frontend
    build:
      context: ../frontend
      args:
        VITE_WS_URL: wss://ws.kvitlach.us
    depends_on:
      - backend
    environment:
      - VITE_WS_URL=wss://ws.kvitlach.us
    restart: unless-stopped
    ports:
      - "127.0.0.1:28080:4173"
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4173"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
