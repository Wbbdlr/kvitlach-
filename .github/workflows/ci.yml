name: CI

# Deploys are RDP-driven and manual (see CLAUDE.md), so nothing here ships
# anything. The single job of this workflow is to make sure the tests actually
# run on every change rather than only when someone remembers -- which was the
# real gap: a regression could reach the deploy tarball with nothing having
# executed a single test first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant. Without
# this, the slow e2e job below queues up behind itself during a run of small
# commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, coverage, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # db.ts is the one module a mock cannot honestly cover: JSONB round-tripping,
    # ON CONFLICT upserts and DISTINCT ON are exactly what a fake gets right for
    # free and a real database does not. src/__tests__/db.test.ts skips itself
    # when TEST_DATABASE_URL is unset (most people have no Postgres running
    # locally) but FAILS LOUDLY if that happens in CI -- a suite that silently
    # skips here would report green while covering nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kvitlach
          POSTGRES_PASSWORD: kvitlach
          POSTGRES_DB: kvitlach_test
        ports:
          - 5432:5432
        # Without the healthcheck the job races the container: Postgres accepts
        # a TCP connection before it is ready to answer queries, so the first
        # test would fail with a connection error roughly at random.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # `tsc -p tsconfig.json` IS the backend typecheck (CLAUDE.md) -- it is
      # clean here, unlike the frontend's, so a type error fails the build.
      - name: Typecheck
        run: npm run build

      # Thresholds live in vitest.config.ts, so a drop in coverage fails here
      # rather than being noticed months later.
      - name: Tests + coverage
        run: npx vitest run --coverage
        env:
          # Its own variable, not DATABASE_URL: these tests write and delete
          # rows, and nobody running the suite on a machine pointed at a live
          # game server should have that happen by accident.
          TEST_DATABASE_URL: postgres://kvitlach:kvitlach@localhost:5432/kvitlach_test

      # NOTE for whoever sees this job red with exactly one failing file:
      # the suite has a known, characterised intermittent flake (~1 run in 63)
      # in the real-WebSocket/real-timer tests -- see TASKS.md's "Open"
      # section. Deliberately NOT retried away: a retry would also hide the
      # flake getting worse. Re-run that one file in isolation
      # (`npx vitest run src/__tests__/<file>.test.ts`) before assuming the
      # change under test broke it.

  frontend:
    name: Frontend (tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tests
        run: npx vitest run

      # `vite build` is the real frontend typecheck -- `tsc --noEmit` reports
      # a pile of pre-existing unrelated ambient-type errors here (CLAUDE.md),
      # so it is deliberately not used.
      - name: Build (also the typecheck)
        run: npx vite build

  e2e:
    name: E2E (real browsers, real WebSockets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Playwright boots its own backend and frontend dev servers (see
      # e2e/playwright.config.ts), so both need their dependencies present
      # even though this job runs no test of its own in either directory.
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install e2e deps
        run: npm ci
        working-directory: e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E
        run: npx playwright test
        working-directory: e2e

      # The trace is the fastest way to see what a failed assertion actually
      # saw (config sets trace: retain-on-failure), and it is worthless if it
      # only ever exists on the runner that already got torn down.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
