server {
    listen 4173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # The ONLY backend paths this origin exposes, and this must stay the
    # complete list.
    #
    # `location =` is an EXACT match, not a prefix: each of these three is
    # proxied and nothing else is. That matters more than it looks. The
    # backend's HTTP port also serves /admin, /metrics and /health/detail, and
    # the sole thing keeping those off the internet is that the port is bound
    # to 127.0.0.1 (ADMIN_BIND in deploy/docker-compose.yml). This proxy runs
    # INSIDE the compose network, where that binding does not apply -- so
    # widening any of these to `location /api/` or `location ^~ /` would
    # publish the admin panel through the tunnel. Add a further exact location
    # if another public route is ever needed; do not relax any of these three.
    #
    # GET only on all three: each operator-authored copy is written from
    # /admin, never from the app.
    location = /api/about {
        limit_except GET { deny all; }
        proxy_pass http://backend:25000/api/about;
        proxy_set_header Host $host;
    }

    location = /api/contact {
        limit_except GET { deny all; }
        proxy_pass http://backend:25000/api/contact;
        proxy_set_header Host $host;
    }

    location = /api/disclaimer {
        limit_except GET { deny all; }
        proxy_pass http://backend:25000/api/disclaimer;
        proxy_set_header Host $host;
    }

    # SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets get an immutable long-term cache
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Security headers on every response
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://ws.kvitlach.us; media-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
}
