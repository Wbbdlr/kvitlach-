server {
    listen 4173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # The ONLY backend paths this origin exposes, and this must stay the
    # complete list.
    #
    # `location =` is an EXACT match, not a prefix: each of these three is
    # proxied and nothing else is. That matters more than it looks. The
    # backend's HTTP port also serves /admin, /metrics and /health/detail, and
    # the sole thing keeping those off the internet is that the port is bound
    # to 127.0.0.1 (ADMIN_BIND in deploy/docker-compose.yml). This proxy runs
    # INSIDE the compose network, where that binding does not apply -- so
    # widening any of these to `location /api/` or `location ^~ /` would
    # publish the admin panel through the tunnel. Add a further exact location
    # if another public route is ever needed; do not relax any of these three.
    #
    # GET only on the three content routes: each operator-authored copy is
    # written from /admin, never from the app. /api/client-error is the one
    # exception and is POST only, for the same reason in reverse -- it is
    # written by the app and read from /admin.
    location = /api/about {
        limit_except GET { deny all; }
        proxy_pass http://backend:25000/api/about;
        proxy_set_header Host $host;
    }

    location = /api/contact {
        limit_except GET { deny all; }
        proxy_pass http://backend:25000/api/contact;
        proxy_set_header Host $host;
    }

    location = /api/disclaimer {
        limit_except GET { deny all; }
        proxy_pass http://backend:25000/api/disclaimer;
        proxy_set_header Host $host;
    }

    location = /api/config {
        limit_except GET { deny all; }
        proxy_pass http://backend:25000/api/config;
        proxy_set_header Host $host;
    }

    location = /api/family {
        limit_except GET { deny all; }
        proxy_pass http://backend:25000/api/family;
        proxy_set_header Host $host;
    }

    # The only public WRITE this proxy carries. A render error in the app posts
    # here so somebody other than the player can read it -- see
    # backend/src/client-errors.ts for the clamping, the fixed-size in-memory
    # ring and the per-IP throttle that make an unauthenticated write endpoint
    # affordable.
    #
    # Exact path and POST only, exactly like its neighbours: this is not a
    # reason to open /api/ as a prefix. The body cap is deliberately small --
    # the backend clamps every field anyway, so anything larger than this is
    # not a report, and rejecting it at the edge keeps it off the event loop.
    location = /api/client-error {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://backend:25000/api/client-error;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A family's own link, kept out of search results.
    #
    # /m/<slug> carries a family's surname, and the rest of this site is meant
    # to be found. This is the one namespace that is not: a family shares their
    # link in their own group chat, and it should not turn up in a search for
    # the family's name months later.
    #
    # X-Robots-Tag rather than a robots.txt Disallow, and the difference
    # matters: a disallowed URL is never fetched, so a crawler never learns it
    # should not be listed, and Google will still index a bare URL it found on
    # a link -- publishing the surname in the URL itself, which is the exact
    # outcome being avoided. Letting it fetch and telling it noindex is what
    # actually keeps it out. robots.txt is also public, so naming /m/ there
    # would advertise the namespace to anyone who reads it.
    #
    # This does not make a link secret -- anyone holding it can open it, by
    # design, and index.html here is byte-identical to the front page's.
    #
    # NOTE the repeated security headers. See the block below for why.
    location ^~ /m/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://ws.kvitlach.us; media-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri /index.html;
    }

    # Hashed assets get an immutable long-term cache.
    #
    # THE REPEATED SECURITY HEADERS ARE LOAD-BEARING, not clutter. nginx's
    # add_header does not merge: a single add_header anywhere in a location
    # DISCARDS every add_header inherited from the server block. This block had
    # only Cache-Control, which meant every hashed .js and .css -- the entire
    # application -- was served with no nosniff, no CSP and no frame-ancestors,
    # while the HTML that loads them had all eight. Nothing reported it because
    # the front page's headers looked correct.
    #
    # So: any new location that sets ANY header has to restate this whole list.
    # Pinned by nginxProxy.test.ts, which fails on a location that sets one
    # header and not the rest.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://ws.kvitlach.us; media-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    # Security headers on every response
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://ws.kvitlach.us; media-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
}
